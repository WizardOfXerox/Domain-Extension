<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Domain Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #070913;
        --card: rgba(17, 24, 39, 0.7);
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(99, 102, 241, 0.3);
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --primary: #6366f1;
        --primary-glow: rgba(99, 102, 241, 0.35);
        --secondary: #3b82f6;
        --ok: #10b981;
        --ok-glow: rgba(16, 185, 129, 0.2);
        --warn: #f59e0b;
        --bad: #ef4444;
        --bad-glow: rgba(239, 68, 68, 0.25);
      }
      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 75%);
        color: var(--fg);
        box-sizing: border-box;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #a5b4fc, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brand svg {
        stroke: #6366f1;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        margin-bottom: 12px;
      }
      .panel-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 1px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .row:last-child {
        border-bottom: none;
      }
      .k {
        color: var(--muted);
        font-size: 12px;
      }
      .v {
        font-size: 12.5px;
        font-weight: 550;
        text-align: right;
        word-break: break-all;
      }
      .domain-highlight {
        font-family: 'JetBrains Mono', monospace;
        color: #fcd34d;
        font-size: 12px;
        background: rgba(251, 191, 36, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(251, 191, 36, 0.15);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        font-size: 11px;
        font-weight: 600;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--warn);
        box-shadow: 0 0 8px var(--warn);
      }
      .dot.ok {
        background: var(--ok);
        box-shadow: 0 0 10px var(--ok);
        animation: pulse 2s infinite;
      }
      .dot.bad {
        background: var(--bad);
        box-shadow: 0 0 10px var(--bad);
      }
      @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 var(--ok-glow); }
        70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
      }
      /* Custom toggle slider */
      .switch {
        position: relative;
        display: inline-block;
        width: 46px;
        height: 22px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(255,255,255,0.06);
        border: 1px solid var(--border);
        transition: .3s;
        border-radius: 22px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: var(--muted);
        transition: .3s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: var(--primary);
        border-color: rgba(99,102,241,0.5);
      }
      input:checked + .slider:before {
        transform: translateX(24px);
        background-color: #ffffff;
        box-shadow: 0 0 8px var(--primary-glow);
      }
      /* Input field */
      input[type="text"], input#backendOriginInput {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
        padding: 8px 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        box-sizing: border-box;
        transition: all 0.2s;
        outline: none;
      }
      input[type="text"]:focus, input#backendOriginInput:focus {
        border-color: var(--primary);
        box-shadow: 0 0 8px var(--primary-glow);
      }
      /* Buttons */
      button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        font-family: inherit;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-1px);
      }
      button:active:not(:disabled) {
        transform: translateY(0);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--primary);
        border-color: rgba(99,102,241,0.5);
      }
      .btn-primary:hover:not(:disabled) {
        background: #4f46e5;
        box-shadow: 0 0 12px var(--primary-glow);
      }
      .btn-danger {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.25);
        color: #fca5a5;
      }
      .btn-danger:hover:not(:disabled) {
        background: rgba(239, 68, 68, 0.25);
        border-color: rgba(239, 68, 68, 0.4);
      }
      /* Message banner */
      .msg {
        font-size: 11.5px;
        color: #a7f3d0;
        margin-top: 10px;
        background: rgba(16, 185, 129, 0.08);
        border: 1px solid rgba(16, 185, 129, 0.15);
        padding: 8px 12px;
        border-radius: 8px;
        display: none;
        word-break: break-word;
        line-height: 1.4;
      }
      .msg.err {
        color: #fecaca;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.15);
      }
      .msg:not(:empty) {
        display: block;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
        margin-top: 12px;
        line-height: 1.4;
        text-align: center;
      }
      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }
      a:hover {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path><path d="M6 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path></svg>
        <span>Domain Extension</span>
      </div>
      <span class="pill">
        <span class="dot" id="serverDot"></span>
        <span id="serverText">checking</span>
      </span>
    </div>

    <!-- Section 1: Connection Details -->
    <div class="panel">
      <div class="panel-title">Active Environment</div>
      <div class="row">
        <span class="k">Domain Host</span>
        <span class="v"><span class="domain-highlight" id="domain">loading</span></span>
      </div>
      <div class="row" id="toggleRow">
        <span class="k">Interception State</span>
        <span class="v" style="display:flex;align-items:center;gap:8px">
          <span id="toggleNote" style="font-size:11px;color:var(--muted)"></span>
          <label class="switch">
            <input type="checkbox" id="modeToggle" />
            <span class="slider"></span>
          </label>
        </span>
      </div>
      <div class="row">
        <span class="k">Local Folder</span>
        <span class="v" id="localSite">-</span>
      </div>
      <div class="row">
        <span class="k">Active Mode</span>
        <span class="v" id="mode" style="text-transform:uppercase;color:#818cf8">-</span>
      </div>
      <div class="row">
        <span class="k">System Proxy Status</span>
        <span class="v" id="proxyState">-</span>
      </div>
      <div class="row">
        <span class="k">Telemetry / Stats</span>
        <span class="v" id="metricsSummary" style="font-family:'JetBrains Mono',monospace">-</span>
      </div>
      <div class="row" style="display:none">
        <span class="v" id="hostsMapped">no</span>
      </div>
    </div>

    <!-- Section 2: Backend Override -->
    <div class="panel">
      <div class="panel-title">Local Reverse Proxy</div>
      <div class="row" style="border-bottom:none;padding-bottom:2px">
        <input id="backendOriginInput" type="text" placeholder="http://127.0.0.1:8000" />
      </div>
      <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
        <button id="clearBackendBtn" class="btn-danger">Clear</button>
        <button id="saveBackendBtn" class="btn-primary">Apply Backend</button>
      </div>
    </div>

    <!-- Section 3: Diagnostic Fixes -->
    <div class="panel" id="panicRow">
      <div class="panel-title">Developer Quick Fixes</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button id="enableProxyBtn">Enable Proxy</button>
        <button id="disableProxyBtn">Disable Proxy</button>
        <button id="resetLocalBtn">Reset Allowlist</button>
        <button id="clearSiteDataBtn">Clear Site Data</button>
      </div>
    </div>

    <!-- Section 4: Quick Add -->
    <div class="panel" id="quickAddRow" style="display:none">
      <div class="panel-title">Routing Additions</div>
      <button id="quickAddBtn" style="width:100%" class="btn-primary">➕ Add Current Domain</button>
    </div>

    <div class="msg" id="msg"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px">
      <a href="javascript:void(0)" id="openOptionsBtn" style="font-size:12px;display:flex;align-items:center;gap:4px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Advanced Dashboard</span>
      </a>
      <span style="font-size:10px;color:var(--muted)">v3.0</span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
